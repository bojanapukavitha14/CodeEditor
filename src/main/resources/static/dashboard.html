<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Code Editor - Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background: #f1f5f9;
        }


        header {

            background: #0f172a;

            color: white;

            padding: 18px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {

            font-size: 24px;

            font-weight: bold;

            color: #60a5fa;
        }


        .logout {

            background: #ef4444;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;
        }


        .container {

            padding: 40px;
        }


        .welcome {

            background: white;

            padding: 30px;

            border-radius: 15px;

            margin-bottom: 30px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.08);
        }


        .welcome h1 {

            color: #1e293b;

            margin-bottom: 10px;
        }


        .welcome p {

            color: #64748b;
        }


        .cards {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 25px;
        }


        .card {

            background: white;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.08);
        }


        .card h2 {

            color: #2563eb;

            margin-bottom: 12px;
        }


        .card p {

            color: #64748b;

            margin-bottom: 20px;
        }


        .open-editor {

            display: inline-block;

            background: #2563eb;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            text-decoration: none;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        &lt;/&gt; Code Editor
    </div>


    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>


<div class="container">


    <div class="welcome">

        <h1>
            Welcome,
            <span id="userName">
                User
            </span>! 👋
        </h1>

        <p>
            Welcome to your Code Editor Dashboard.
        </p>

    </div>


    <div class="cards">


        <div class="card">

            <h2>💻 Code Editor</h2>

            <p>
                Write and run HTML, CSS and
                JavaScript code.
            </p>

            <a
                href="index.html"
                class="open-editor">

                Open Editor

            </a>

        </div>


        <div class="card">

            <h2>👤 Profile</h2>

            <p>
                View your registered email
                address.
            </p>

            <strong id="userEmail"></strong>

        </div>


        <div class="card">

            <h2>🚀 Projects</h2>

            <p>
                Create and manage your
                coding projects.
            </p>

        </div>


    </div>

</div>


<script>

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if (!user) {

    window.location.href =
        "login.html";

}


if (user) {

    document
        .getElementById("userName")
        .textContent =
        user.name;


    document
        .getElementById("userEmail")
        .textContent =
        user.email;

}


function logout() {

    localStorage.removeItem("user");

    window.location.href =
        "login.html";

}

</script>


</body>

</html>
