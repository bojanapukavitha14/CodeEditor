<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Code Editor - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #141e30,
                    #243b55
                );
        }

        .container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.3);
        }

        h1 {

            text-align: center;

            color: #2563eb;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

        .register-link {

            text-align: center;

            margin-top: 20px;
        }

        .register-link a {

            color: #2563eb;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Code Editor</h1>

    <p class="subtitle">
        Login to your account
    </p>


    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>


    <p id="message"></p>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    try {

        const response = await fetch(
            "/api/auth/login",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    password: password

                })

            }
        );


        const result = await response.json();

console.log("Login response:", result);

if (response.ok) {
    // Save logged-in user's information
    localStorage.setItem("user", JSON.stringify(result));

    // Go to dashboard
    window.location.href = "dashboard.html";
} else {
    message.textContent = result.message || "Login failed.";
    message.style.color = "red";
}


    } catch (error) {

        document
            .getElementById("message")
            .textContent =
            "Unable to connect to server.";

        document
            .getElementById("message")
            .style.color =
            "red";

    }

});

</script>

</body>

</html>
